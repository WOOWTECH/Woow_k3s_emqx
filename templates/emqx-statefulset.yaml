---
# EMQX MQTT broker — StatefulSet (preserves stable pod DNS for clustering).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: emqx
  namespace: {{ include "emqx.ns" . }}
  labels:
    app: emqx
spec:
  serviceName: {{ .Values.emqx.headlessService.name }}
  replicas: {{ .Values.emqx.replicas }}
  selector:
    matchLabels:
      app: emqx
  template:
    metadata:
      labels:
        app: emqx
    spec:
      # The emqx/emqx image runs as uid/gid 1000 (non-root). fsGroup makes the
      # PVC-backed volumes group-writable regardless of provisioner: local-path
      # already creates world-writable hostPath dirs, but Longhorn (the
      # required class for test installs) mounts them root-owned 0755, which
      # fails with "Permission denied" on emqx-data/emqx-log without this.
      securityContext:
        fsGroup: 1000
      containers:
        - name: emqx
          image: "{{ .Values.emqx.image.repository }}:{{ .Values.emqx.image.tag }}"
          imagePullPolicy: {{ .Values.emqx.image.pullPolicy }}
          ports:
            - name: mqtt-tcp
              containerPort: 1883
              protocol: TCP
            - name: mqtt-ssl
              containerPort: 8883
              protocol: TCP
            - name: mqtt-ws
              containerPort: 8083
              protocol: TCP
            - name: mqtt-wss
              containerPort: 8084
              protocol: TCP
            - name: dashboard
              containerPort: 18083
              protocol: TCP
          envFrom:
            - configMapRef:
                name: emqx-config
            - secretRef:
                name: emqx-secret
          volumeMounts:
            - name: emqx-data
              mountPath: /opt/emqx/data
            - name: emqx-log
              mountPath: /opt/emqx/log
          # ── Health checks ────────────────────────────────────────
          livenessProbe:
            exec:
              command:
                - /opt/emqx/bin/emqx
                - ctl
                - status
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - /opt/emqx/bin/emqx
                - ctl
                - status
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 15
            failureThreshold: 3
          startupProbe:
            exec:
              command:
                - /opt/emqx/bin/emqx
                - ctl
                - status
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 15
            failureThreshold: 30
          # ── Resources ────────────────────────────────────────────
          resources:
            {{- toYaml .Values.emqx.resources | nindent 12 }}
      volumes:
        - name: emqx-data
          persistentVolumeClaim:
            claimName: emqx-data
        - name: emqx-log
          persistentVolumeClaim:
            claimName: emqx-log
