# Default values for the emqx chart.
# Defaults reproduce the original Kustomize deployment 1:1
# (namespace emqx, StatefulSet with headless service, NodePorts 31883/31808
# for MQTT-TCP and dashboard, local-path storage).

namespace:
  # Render the Namespace object. A namespace equal to the release namespace
  # (`-n`) is never rendered - create it with --create-namespace instead - so
  # `helm uninstall` can never delete the namespace the release lives in.
  create: true
  name: emqx

# Add `helm.sh/resource-policy: keep` to the Namespace, PVCs and the
# chart-created Secret, so `helm uninstall` never deletes broker data or logs.
keepOnUninstall: true

# Default StorageClass for every PVC in this chart.
storageClassName: local-path

secrets:
  # false (default): the emqx-secret Secret already exists (created from
  #   examples/secrets.example.yaml) and the chart never renders it, so a
  #   `helm upgrade` can never overwrite a real dashboard password with an
  #   empty one.
  # true: render emqx-secret from the values below (fresh installs, tests).
  create: false
  # Not sensitive on its own, so it keeps a real default even when
  # secrets.create=true.
  dashboardUsername: "admin"
  # No default: required() fires when secrets.create=true and this is empty.
  dashboardPassword: ""

emqx:
  image:
    repository: emqx/emqx
    tag: latest
    # "Always" matches the original manifests' behaviour with the
    # :latest tag (Kubernetes defaults to Always for :latest).
    pullPolicy: Always

  # Number of EMQX replicas. Keep at 1 for the default single-node deploy;
  # scale up only after configuring cluster discovery.
  replicas: 1

  # Exposed to the container via a ConfigMap (envFrom).
  # EMQX_NODE_NAME must match the StatefulSet pod DNS so the node identity
  # is stable across restarts.
  config:
    EMQX_NODE_NAME: "emqx@emqx-0.emqx-headless.emqx.svc.cluster.local"
    EMQX_ALLOW_ANONYMOUS: "true"

  service:
    # Client-facing service (MQTT + dashboard).
    type: NodePort
    # NodePorts are only rendered when service.type is NodePort.
    # nodePort.mqttTcp   -> 1883  (MQTT plain TCP)
    # nodePort.dashboard -> 18083 (dashboard HTTP)
    nodePort:
      mqttTcp: 31883
      dashboard: 31808
    # mqtt-ssl (8883), mqtt-ws (8083) and mqtt-wss (8084) are exposed as
    # regular ports on the NodePort service without a fixed nodePort — a
    # random one is assigned; set nodePort_mqttSsl / nodePort_mqttWs /
    # nodePort_mqttWss below to pin them.
    nodePort_mqttSsl: null
    nodePort_mqttWs: null
    nodePort_mqttWss: null

  # Headless service for stable pod DNS (required by the StatefulSet).
  headlessService:
    name: emqx-headless

  persistence:
    # PVC for EMQX runtime data (rules, auth, mnesia).
    data:
      # "" = use the top-level storageClassName.
      storageClassName: ""
      size: 5Gi
    # PVC for EMQX runtime logs.
    log:
      # "" = use the top-level storageClassName.
      storageClassName: ""
      size: 2Gi

  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

tests:
  # `helm test` smoke pod: dashboard /status, MQTT publish/subscribe
  # round-trip. Read-only against the broker's own data.
  enabled: true
