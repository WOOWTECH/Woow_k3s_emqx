{{- /*
Secret, rendered only with secrets.create=true. By default emqx-secret
already exists (see examples/secrets.example.yaml) and the chart never
touches it, so a `helm upgrade` can never overwrite a real dashboard
password with an empty one.
*/ -}}
{{- if .Values.secrets.create }}
---
apiVersion: v1
kind: Secret
metadata:
  name: emqx-secret
  namespace: {{ include "emqx.ns" . }}
  labels:
    app: emqx
  {{- include "emqx.keepAnnotations" . | nindent 2 }}
type: Opaque
stringData:
  EMQX_DASHBOARD__DEFAULT_USERNAME: {{ .Values.secrets.dashboardUsername | quote }}
  EMQX_DASHBOARD__DEFAULT_PASSWORD: {{ required "secrets.dashboardPassword is required when secrets.create=true" .Values.secrets.dashboardPassword | quote }}
{{- end }}
