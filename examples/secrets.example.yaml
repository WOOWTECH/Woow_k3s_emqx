# -----------------------------------------------------------------------------
# Secret for Woow_k3s_emqx - PLACEHOLDERS ONLY. Never commit real values.
#
# Used with the default secrets.create=false: the chart only references this
# Secret by name (envFrom on the StatefulSet). Copy this file OUTSIDE the
# repo, replace REPLACE_ME, then apply that copy:
#   kubectl --context woow-k3s apply -f /secure/path/emqx-secret.yaml
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: emqx-secret
  namespace: emqx
type: Opaque
stringData:
  EMQX_DASHBOARD__DEFAULT_USERNAME: admin
  EMQX_DASHBOARD__DEFAULT_PASSWORD: REPLACE_ME
