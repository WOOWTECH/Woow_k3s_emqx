{{- /*
Namespace. One that equals the release namespace is skipped: Helm keeps its
release record there, so it is created with --create-namespace instead and
can never be deleted by `helm uninstall`.
*/ -}}
{{- if and .Values.namespace.create (ne (include "emqx.ns" .) .Release.Namespace) }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "emqx.ns" . }}
  labels:
    app: emqx
    managed-by: helm
  {{- include "emqx.keepAnnotations" . | nindent 2 }}
{{- end }}
